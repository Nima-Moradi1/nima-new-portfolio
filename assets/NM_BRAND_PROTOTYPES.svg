<title id="candidate-C-title">C / folded ribbon / alternative</title>
<desc id="candidate-C-description">Original comparison sketch. A continuous folded band suggests the N stroke and M valley with overlapping tonal planes. A future mesh would need separated fold depths, bevel clearance and explicit occlusion control; the connected valley is more vulnerable to merging at 24 pixels. Not implemented in production.</desc>
