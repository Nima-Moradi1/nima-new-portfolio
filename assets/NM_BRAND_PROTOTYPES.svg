<title id="candidate-B-title">B / shared spine / alternative</title>
<desc id="candidate-B-description">Original comparison sketch. The N diagonal and M valley meet through a common central upright. A continuous spine creates a compact silhouette but concentrates visual weight at the joint. Extrusion would need consistent wall thickness and a recessed light channel so the joint remains readable during rotation. Not implemented in production.</desc>
