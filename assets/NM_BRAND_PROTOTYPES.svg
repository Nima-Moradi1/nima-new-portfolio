<title id="candidate-A-title">A / split plane / selected</title>
<desc id="candidate-A-description">Current production symbol. Exact paths from public/brand/nm-symbol.svg, without redrawing. Separate N and M planes preserve a three-unit central gap and stems of at least eight units within the 80-unit master. This permits simple planar extrusion, shallow bevels and one restrained light slit. The production procedural hero and captures document this choice; these sketches do not certify new physical-device acceptance.</desc>
