<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="nm-prototypes-title nm-prototypes-description">
<title id="nm-prototypes-title">NM brand prototypes: A selected split-plane, B shared-spine, C folded-ribbon</title>
<desc id="nm-prototypes-description">Three original geometric NM sketch candidates for Nima Moradirad, arranged side by side. A is the current selected production mark; B and C are unimplemented alternatives. Each has a large silhouette and an actual 24 by 24 unit preview. All labels are original vector strokes, with no embedded fonts, third-party graphics, models or raster images. Selection prioritizes separated letterforms, planar extrusion and a narrow light channel.</desc>
<metadata>Created 2026-10-20 for Nima Moradirad. Original project artwork; rights remain with the project owner under the repository terms. Source: candidate A uses the exact original public/brand/nm-symbol.svg paths; B, C and label geometry authored directly for this comparison. No third-party artwork, font, model or source asset is incorporated.</metadata>
