  />
  <rect x="72" y="53" width="1056" height="644" rx="27" fill="#F8F5EF" />
  <rect x="72" y="53" width="1056" height="82" rx="27" fill="#EDE9DF" />
  <path
    d="M72 108c0-15 12-27 27-27h1002c15 0 27 12 27 27v27H72v-27Z"
