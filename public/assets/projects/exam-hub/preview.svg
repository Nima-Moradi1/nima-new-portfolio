<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="750"
  viewBox="0 0 1200 750"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Exam Hub project preview</title>
  <desc id="description">
    A Persian web-skills assessment dashboard for HTML and CSS.
  </desc>
  <defs>
    <linearGradient
      id="background"
      x1="80"
      y1="24"
      x2="1134"
      y2="724"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#15201B" />
      <stop offset="1" stop-color="#0B100E" />
    </linearGradient>
    <linearGradient
      id="html-card"
      x1="174"
      y1="349"
      x2="531"
      y2="632"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#D88B54" />
      <stop offset="1" stop-color="#A2472D" />
    </linearGradient>
    <linearGradient
      id="css-card"
      x1="599"
      y1="349"
      x2="956"
      y2="632"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#698ED2" />
      <stop offset="1" stop-color="#394E9B" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)" />
  <circle
    cx="1024"
    cy="103"
    r="206"
    fill="#C9FA58"
    fill-opacity=".13"
