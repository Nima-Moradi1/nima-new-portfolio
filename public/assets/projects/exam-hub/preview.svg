    </text>
    <text x="1056" y="475" fill="white" font-size="35" font-weight="700">
      آزمون‌های CSS
    </text>
    <text x="1056" y="512" fill="#EEF2FF" font-size="16">
      ۲ بخش · هر بخش ۴۰ پرسش
    </text>
  </g>
  <path
    d="M148 574h89m229 0h89m129 0h89m229 0h89"
    stroke="white"
    stroke-opacity=".75"
    stroke-width="3"
    stroke-linecap="round"
  />
