  />
  <circle cx="113" cy="94" r="8" fill="#D36E58" />
  <circle cx="139" cy="94" r="8" fill="#D9AE55" />
  <circle cx="165" cy="94" r="8" fill="#74A470" />
  <g font-family="Arial, sans-serif" text-anchor="end">
    <text x="1018" y="88" fill="#1D2721" font-size="22" font-weight="700">
