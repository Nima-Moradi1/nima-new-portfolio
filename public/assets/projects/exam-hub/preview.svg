    </text>
  </g>
  <rect x="106" y="175" width="988" height="128" rx="21" fill="#18221D" />
  <circle cx="175" cy="239" r="32" fill="#C9FA58" fill-opacity=".18" />
  <path
    d="m164 230-12 10 12 10m22-20 12 10-12 10m-5-23-10 26"
    stroke="#C9FA58"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <g font-family="Arial, sans-serif" text-anchor="end">
    <text x="1010" y="222" fill="#C9FA58" font-size="15">
